name: CI/CD Pipeline - Car ERP Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Cho phép kích hoạt deploy thủ công từ giao diện GitHub

jobs:
  # =========================================================================
  # JOB 1: KIỂM THỬ VÀ VALIDATE TRƯỚC (CHỐNG LỖI LÀM SẬP PRODUCTION)
  # =========================================================================
  ci:
    name: 🧪 CI Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: BE/go.sum

      - name: Run Backend Unit Tests (Go)
        run: |
          cd BE
          go test -v ./...

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Verify Frontend Build (Next.js)
        run: |
          cd FE
          npm ci --legacy-peer-deps
          npm run build

  # =========================================================================
  # JOB 2: DEPLOY LÊN PRODUCTION SERVER QUA CLOUDFLARE ZERO TRUST TUNNEL
  # =========================================================================
  deploy:
    name: 🚀 Deploy to Production Server
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key & Cloudflare Zero Trust Tunnel
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          cat << 'EOF' > ~/.ssh/config
          Host ssh.namhoanglegal.com
              HostName ssh.namhoanglegal.com
              User ${{ secrets.SERVER_USER }}
              Port 22
              IdentityFile ~/.ssh/id_rsa
              ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Execute Deployment on Remote Server
        run: |
          ssh -T -F ~/.ssh/config ssh.namhoanglegal.com << 'EOF'
            set -euo pipefail

            echo "[Deploy] Di chuyển vào thư mục dự án..."
            cd ~/car-erp

            echo "[Deploy] Dọn sạch thay đổi tạm thời trên server..."
            git checkout -- BE/Dockerfile || true

            echo "[Deploy] Pull mã nguồn mới nhất từ main..."
            git pull origin main

            echo "[Deploy] Rebuild và cập nhật các container..."
            docker compose up --build -d

            echo "[Deploy] Dọn dẹp Docker images cũ..."
            docker image prune -f

            echo "[Deploy] Hoàn tất cập nhật container thành công!"
          EOF

      - name: Verify Backend Health Check
        run: |
          echo "Đang kiểm tra phản hồi thực tế của Backend API..."
          sleep 5
          curl --fail --retry 5 --retry-delay 3 --retry-connrefused https://api-carerp.namhoanglegal.com/health || exit 1
          echo "Backend đã phản hồi Healthy 200 OK!"

      # GỬI THÔNG BÁO TELEGRAM CHI TIẾT
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅ DEPLOY CAR ERP THÀNH CÔNG!' || '❌ DEPLOY CAR ERP THẤT BẠI!' }}
            ━━━━━━━━━━━━━━━━━━━
            🔹 Trạng thái: ${{ job.status }}
            🔹 Nhánh: ${{ github.ref_name }}
            🔹 Tác giả: ${{ github.actor }}
            🔹 Commit: ${{ github.event.head_commit.message || github.sha }}
            🔹 Xem chi tiết log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
