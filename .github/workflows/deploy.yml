name: Deploy Car ERP to Production

# Kích hoạt tự động mỗi khi có code mới đẩy lên nhánh main
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Cloudflare Zero Trust Tunnel
        run: |
          # 1. Tạo thư mục bảo mật cho cấu hình SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 2. Đưa Private Key từ GitHub Secret vào file định danh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 3. Tải và cài đặt công cụ cloudflared để mở đường hầm
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          # 4. Tạo file cấu hình SSH định tuyến qua Cloudflare Access kèm Service Token
          cat << 'EOF' > ~/.ssh/config
          Host ssh.namhoanglegal.com
              HostName ssh.namhoanglegal.com
              User ${{ secrets.SERVER_USER }}
              Port 22
              IdentityFile ~/.ssh/id_rsa
              ProxyCommand cloudflared access ssh --hostname %h --client-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --client-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Execute Deployment on Remote Server via Tunnel
        run: |
          # 5. Gọi lệnh ssh (với cờ -T) qua file cấu hình để thực thi lệnh deploy trên server Ubuntu
          ssh -T -F ~/.ssh/config ssh.namhoanglegal.com << 'EOF'
            cd ~/car-erp
            git pull origin main
            docker compose up --build -d
            docker image prune -f
            echo "🚀 Deployment completed successfully via Zero Trust Service Token!"
          EOF
