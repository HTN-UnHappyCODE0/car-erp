name: Deploy Car ERP to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Cloudflare Tunnel (cloudflared)
        uses: cloudflare/setup-cloudflared@v3

      - name: Deploy to Ubuntu Server via Zero Trust Tunnel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.namhoanglegal.com
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22022
          proxy_command: cloudflared access ssh --hostname ssh.namhoanglegal.com
          script_stop: true
          script: |
            cd ~/car-erp
            git pull origin main
            docker compose up --build -d
            docker image prune -f
            echo "🚀 Deployment completed successfully via Zero Trust!"
