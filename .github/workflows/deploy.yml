name: Deploy Car ERP to Production

# Kích hoạt tự động mỗi khi có lệnh push lên nhánh main
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Di chuyển vào thư mục chứa dự án trên server
            cd ~/car-erp

            # 2. Kéo code mới nhất từ nhánh main về
            git pull origin main

            # 3. Tiến hành build lại Docker container (tận dụng cache để quá trình diễn ra siêu tốc)
            docker compose up --build -d

            # 4. Dọn dẹp các Docker image cũ không dùng đến để giải phóng ổ cứng
            docker image prune -f

            echo "🚀 Deployment completed successfully!"
