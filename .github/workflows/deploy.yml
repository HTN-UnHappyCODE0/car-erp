name: Deploy Car ERP to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH to use Cloudflare Tunnel Proxy
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Cấu hình SSH client trên runner tự động định tuyến qua lệnh cloudflared access ssh
          cat << 'EOF' > ~/.ssh/config
          Host ssh.namhoanglegal.com
              User ${{ secrets.SERVER_USER }}
              Port 22022
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy to Ubuntu Server via Zero Trust Tunnel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.namhoanglegal.com
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22022
          script_stop: true
          script: |
            cd ~/car-erp
            git pull origin main
            docker compose up --build -d
            docker image prune -f
            echo "🚀 Deployment completed successfully via Zero Trust!"
