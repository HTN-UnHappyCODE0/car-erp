name: Deploy Car ERP to Production

# Kích hoạt tự động mỗi khi có code mới đẩy lên nhánh main
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Cloudflare Zero Trust Tunnel
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          cat << 'EOF' > ~/.ssh/config
          Host ssh.namhoanglegal.com
            HostName ssh.namhoanglegal.com
            User ${{ secrets.SERVER_USER }}
            Port 22        # <--- ĐẢM BẢO LÀ CỔNG 22
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h --client-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --client-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Execute Deployment on Remote Server via Tunnel
        run: |
          # Đã thêm cờ -vvv để soi chi tiết tiến trình kết nối
          ssh -vvv -T -F ~/.ssh/config ssh.namhoanglegal.com << 'EOF'
            cd ~/car-erp
            git pull origin main
            docker compose up --build -d
            docker image prune -f
            echo "🚀 Deployment completed successfully via Zero Trust Service Token!"
          EOF
