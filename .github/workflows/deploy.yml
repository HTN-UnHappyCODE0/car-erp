name: Deploy Car ERP to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Cloudflare Tunnel Proxy
        run: |
          # 1. Tạo thư mục .ssh
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 2. Giải mã Private Key từ GitHub Secret vào file id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 3. Cài đặt cloudflared trên runner
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          # 4. Cấu hình SSH trỏ qua Cloudflare Access Tunnel
          cat << 'EOF' > ~/.ssh/config
          Host ssh.namhoanglegal.com
              User ${{ secrets.SERVER_USER }}
              Port 22022
              IdentityFile ~/.ssh/id_rsa
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Execute Deployment on Remote Server via Tunnel
        run: |
          # Ép lệnh ssh sử dụng đúng file cấu hình và định danh tại thư mục .ssh
          ssh -F ~/.ssh/config ssh.namhoanglegal.com << 'EOF'
            cd ~/car-erp
            git pull origin main
            docker compose up --build -d
            docker image prune -f
            echo "🚀 Deployment completed successfully via Zero Trust Tunnel!"
          EOF
