version: "3.8"

networks:
  car-erp-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: car_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: car_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - car-erp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d car_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend Go API ---
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: car_erp_backend
    restart: always
    environment:
      - APP_ENV=production
      - DB_URL=postgresql://root:secretpassword@postgres:5432/car_erp_db?sslmode=disable
      - SERVER_PORT=8080
      - TOKEN_SYMMETRIC_KEY=car_erp_production_jwt_symmetric_key_32bytes_min!
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - car-erp-net

  # --- Frontend Next.js 15 ---
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: car_erp_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - car-erp-net
